version: "3.9"

services:
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage

  ingester:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      # Monta tu carpeta de documentos Windows dentro del contenedor (ajusta la ruta)
      - /d/LicitacionesTesis:/data:ro
      - ./:/app
    environment:
      - QDRANT_URL=${QDRANT_URL}
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - COLLECTION_NAME=${COLLECTION_NAME}
      - EMB_MODEL=${EMB_MODEL}
      - INPUT_DIR=/data
      - CHUNK_SIZE=1200
      - CHUNK_OVERLAP=200
      - MAX_WORKERS=4
    command: ["bash", "-lc", "pip install -r requirements.txt && python ingest.py"]
    depends_on:
      - qdrant

volumes:
  qdrant_storage:
